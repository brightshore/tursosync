name: Integration

# Full lane — builds the Turso sync native (Release + FTS) from source and downloads the prebuilt `tursodb`
# sync server, both at the pinned engine ref (turso-engine.json), then runs the whole suite for real,
# including the live-sync integration tests that spawn `tursodb --sync-server`. This is the only lane that
# exercises the native + remote sync path.
#
# It is GATED so it doesn't rebuild the engine on every commit:
#   - push to main             — validate merges AND warm the binary cache on the default branch
#   - workflow_dispatch        — run it on demand
#   - schedule (weekly)        — catch upstream/regression drift
#   - push tag TursoSync@*     — validate a release build
#   - pull_request `full-ci`   — opt in per PR (engine-bump PRs get the label automatically)
#
# Built native + server binaries are cached by engine SHA, so reruns at an unchanged pin skip the Rust build.
# The main run matters for sharing: GitHub scopes a cache to the branch that wrote it, and PRs can only read
# their own ref or the DEFAULT branch — so the cache must be warmed on main for PRs to get a hit (a sibling
# PR's cache is invisible). Without the main run every PR rebuilds from scratch.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC (before the engine-bump job at 07:00)
  push:
    branches: [main]
    tags: ['TursoSync@*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    # On PRs, only run when the `full-ci` label is present; always run for dispatch/schedule/tag.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: integration · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read engine pin
        id: pin
        shell: bash
        run: |
          sha=$(grep -oE '"sha"[[:space:]]*:[[:space:]]*"[0-9a-f]+"' turso-engine.json | grep -oE '[0-9a-f]{7,40}')
          [ -n "$sha" ] || { echo "::error::no sha in turso-engine.json"; exit 1; }
          tag=$(grep -oE '"tag"[[:space:]]*:[[:space:]]*"[^"]+"' turso-engine.json | grep -oE 'v[0-9][^"]*')
          [ -n "$tag" ] || { echo "::error::no tag in turso-engine.json"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Cache the built artifacts (native lib + tursodb) keyed on the engine SHA. A hit skips the engine
      # checkout + Rust toolchain + cargo build entirely — the binaries are deterministic for a given pin.
      - name: Cache Turso binaries
        id: turso-bin
        uses: actions/cache@v4
        with:
          path: turso-bin
          key: turso-bin-v2-${{ runner.os }}-${{ steps.pin.outputs.sha }}

      - name: Setup Rust
        if: steps.turso-bin.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout Turso engine
        if: steps.turso-bin.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: tursodatabase/turso
          ref: ${{ steps.pin.outputs.sha }}
          path: turso

      # No Rust dependency cache here on purpose: the turso-bin cache above already skips the whole build at
      # an unchanged engine pin, and a cold build only happens when the pin (and thus this key) changes — when
      # a dep cache for the new SHA wouldn't exist anyway. A ~600 MB/OS rust-cache would be dead weight that
      # just crowds the 10 GB repo cache budget and evicts the small turso-bin caches that do the real work.
      # Only the sync native (turso_sync_sdk_kit) is built from source — it is NOT published prebuilt anywhere
      # (the release ships only the turso_cli/tursodb binaries; the official Turso.Data.Sqlite NuGet ships the
      # *base* turso_sdk_kit, which lacks the sync engine + FTS). tursodb, by contrast, IS a published release
      # artifact, so we download it instead of a second cargo build.
      - name: Build Turso sync native (Release, FTS)
        if: steps.turso-bin.outputs.cache-hit != 'true'
        shell: bash
        env:
          # Link the MSVC C runtime statically, so the DLL loads on a Windows box without the VC++
          # redistributable (it otherwise fails as "module could not be found", which reads as no native at
          # all). Not RUSTFLAGS: that would REPLACE the engine's own `cfg(target_env = "msvc")` rustflags
          # (--cfg=tokio_unstable, which the sync engine needs); this per-triple variable is joined with them.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --manifest-path turso/Cargo.toml -p turso_sync_sdk_kit --features turso_sdk_kit/fts --release
          mkdir -p turso-bin
          # cdylib name varies by OS (lib*.so / lib*.dylib / *.dll); copy whichever exists.
          # nullglob so a pattern matching nothing disappears rather than being passed through
          # literally: with `[ -f "$f" ] && cp ...` as the last command in the step, the
          # always-unmatched pattern (.dll off Windows) made the step exit 1 even though the
          # build had succeeded.
          shopt -s nullglob
          copied=0
          for f in turso/target/release/*turso_sync_sdk_kit*.so \
                   turso/target/release/*turso_sync_sdk_kit*.dylib \
                   turso/target/release/*turso_sync_sdk_kit*.dll; do
            cp "$f" turso-bin/
            copied=1
          done
          # Still fail loudly if the build genuinely produced nothing to copy.
          if [ "$copied" -ne 1 ]; then
            echo "No turso_sync_sdk_kit cdylib found under turso/target/release" >&2
            exit 1
          fi

      - name: Download tursodb sync server (prebuilt release artifact)
        if: steps.turso-bin.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p turso-bin
          case "${{ runner.os }}-$(uname -m)" in
            Linux-x86_64)   triple=x86_64-unknown-linux-gnu;  ext=tar.xz ;;
            Linux-aarch64)  triple=aarch64-unknown-linux-gnu; ext=tar.xz ;;
            macOS-arm64)    triple=aarch64-apple-darwin;       ext=tar.xz ;;
            macOS-x86_64)   triple=x86_64-apple-darwin;        ext=tar.xz ;;
            Windows-x86_64) triple=x86_64-pc-windows-msvc;     ext=zip ;;
            *) echo "::error::unmapped runner ${{ runner.os }}-$(uname -m)"; exit 1 ;;
          esac
          asset="turso_cli-${triple}.${ext}"
          gh release download "${{ steps.pin.outputs.tag }}" --repo tursodatabase/turso -p "$asset" -O "$asset"
          rm -rf turso-cli-extract && mkdir turso-cli-extract
          if [ "$ext" = "zip" ]; then unzip -q -o "$asset" -d turso-cli-extract; else tar -xf "$asset" -C turso-cli-extract; fi
          bin=$(find turso-cli-extract -type f -name 'tursodb*' | head -1)
          [ -n "$bin" ] || { echo "::error::tursodb not found in $asset"; exit 1; }
          cp "$bin" turso-bin/

      - name: Export native + server paths
        shell: bash
        run: |
          echo "TURSOSYNC_NATIVE_DIR=${{ github.workspace }}/turso-bin" >> "$GITHUB_ENV"
          exe=""
          [ "${{ runner.os }}" = "Windows" ] && exe=".exe"
          echo "TURSOSYNC_TEST_SYNC_SERVER=${{ github.workspace }}/turso-bin/tursodb$exe" >> "$GITHUB_ENV"

      # The native is built nowhere else, and an Actions cache cannot be fetched from outside a workflow, so
      # publish the binaries as a run artifact: `gh run download <run> -n turso-bin-<OS>` puts this exact build
      # on a dev box or a self-hosted runner for debugging a platform-only failure.
      - name: Upload Turso binaries
        uses: actions/upload-artifact@v4
        with:
          name: turso-bin-${{ runner.os }}
          path: turso-bin
          retention-days: 14
          if-no-files-found: error

      - name: Restore
        run: dotnet restore TursoSync.slnx

      - name: Build (Release, warnings-as-errors)
        run: dotnet build TursoSync.slnx --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test TursoSync.slnx --configuration Release --no-build --verbosity normal
